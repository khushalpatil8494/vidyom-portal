<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidyom</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #499c65 0%, #273f4d 100%);
      padding: 20px;
    }

    .box {
      text-align: center;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 1rem;
    }

    .logo-icon img {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .logo-icon img:hover {
      transform: scale(1.1);
    }

    .logo-text {
      font-size: 2.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #e0e7ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      color: rgba(255,255,255,0.9);
      font-size: 1.1rem;
      margin-bottom: 2rem;
      font-weight: 400;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      display: block;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      color: white;
      box-shadow: 0 8px 20px rgba(79,70,229,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(79,70,229,0.4);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      .logo-text {
        font-size: 2.2rem;
      }
      .box {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="box">
    <!-- YOUR CUSTOM LOGO - Replace 'your-logo.png' with your logo file -->
    <div class="logo-container">
      <div class="logo-icon">
        <img src="VIDYOMIMG.png" alt="Vidyom Logo">
      </div>
      <h1 class="logo-text">VIDYOM</h1>
    </div>
    
    <p class="tagline">Empowering Minds, Shaping Futures</p>

    <div class="button-group">
      <a href="login.html" class="btn btn-primary">Login</a>
      <a href="register.html" class="btn btn-secondary">Create Account</a>
    </div>
  </div>
</body>
</html>
